<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bambu AI Monitor</title>
<style>
  body { background:#0a0e14; color:#e6e6e6; font-family:sans-serif; margin:0; padding:24px; }
  h1 { font-size:18px; font-weight:500; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card { background:#12161f; border:1px solid #232838; border-radius:10px; padding:16px; }
  .card h2 { font-size:14px; color:#9aa4b8; margin:0 0 12px; text-transform:uppercase; letter-spacing:.05em; }
  .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #1c2130; font-size:14px; }
  .stat:last-child { border-bottom:none; }
  img#snapshot { width:100%; border-radius:8px; background:#000; display:block; }
  .actions { display:flex; gap:10px; margin-top:14px; }
  button { flex:1; padding:10px; border-radius:8px; border:none; font-size:14px; cursor:pointer; }
  #pause-btn { background:#2a3550; color:#cfe0ff; }
  #cancel-btn { background:#5a1f1f; color:#ffd6d6; }
  #status-msg { font-size:13px; color:#9aa4b8; margin-top:10px; }
</style>
</head>
<body>
  <h1>Bambu AI Monitor</h1>
  <div class="grid">
    <div class="card">
      <h2>Camera feed</h2>
      <img id="snapshot" src="/snapshot" alt="latest snapshot" onerror="this.style.opacity=0.3">
      <div class="actions">
        <button id="pause-btn" onclick="control('pause')">Pause print</button>
        <button id="cancel-btn" onclick="control('cancel')">Cancel print</button>
      </div>
      <div id="status-msg"></div>
    </div>
    <div class="card">
      <h2>Print status</h2>
      <div id="stats">
        <div class="stat"><span>Bed temp</span><span id="bed_temp">-</span></div>
        <div class="stat"><span>Nozzle temp</span><span id="nozzle_temp">-</span></div>
        <div class="stat"><span>Progress</span><span id="progress_percent">-</span></div>
        <div class="stat"><span>Time remaining</span><span id="time_remaining_min">-</span></div>
        <div class="stat"><span>Layer</span><span id="layer">-</span></div>
        <div class="stat"><span>Stage</span><span id="stage">-</span></div>
      </div>
    </div>
  </div>

<script>
async function refresh() {
  try {
    const res = await fetch('/printer/status');
    const data = await res.json();
    for (const key of ['bed_temp','nozzle_temp','progress_percent','time_remaining_min','layer','stage']) {
      const el = document.getElementById(key);
      if (el) el.textContent = (data[key] ?? '-');
    }
    document.getElementById('snapshot').src = '/snapshot?t=' + Date.now();
  } catch (e) {
    console.error(e);
  }
}

async function control(action) {
  const msg = document.getElementById('status-msg');
  msg.textContent = 'Sending ' + action + '...';
  try {
    const res = await fetch('/printer/' + action, { method: 'POST' });
    const data = await res.json();
    msg.textContent = data.status || 'done';
  } catch (e) {
    msg.textContent = 'Error: ' + e;
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
